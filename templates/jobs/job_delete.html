{% extends 'base.html' %}
{% load static %}
{% block content %}

    <div class="container mt-5 mb-5">
        <div class="row gx-5 justify-content-center"> 
            <div class="col-auto d-flex justify-content-center">
                <div class="card shadow border-0" style="width:100%; max-width:600px; border-radius:15px;">
                    <div class="card-body p-4">
                        <form method="post">
                            <h1>Видалення</h1>
                            <p>Ви точно хочете видалити?</p>
                            {% csrf_token %}
                            <div class="d-grid gap-2 d-md-flex">
                                <button type="submit" class="btn btn-secondary w-100">Так</button>
                                <a href="{% url 'job_list' %}" class="btn btn-danger w-100">Ні</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>


{% endblock %}
