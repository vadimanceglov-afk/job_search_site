{% extends 'base.html' %}
{% load static %}
{% block content %}
<h1>Resume</h1>
        {{ resume.author }}|
        {{ resume.title }}|
        {{ resume.description }}|


{% if user.employer %} 
    <form action="{% url 'change_status' appli.id 'accepted' %}" method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-success">Прийняти</button>
    </form>

    <form action="{% url 'change_status' appli.id 'rejected' %}" method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Відхилити</button>
    </form>
{% else %}
--=--
{% endif %}

{% endblock %}
