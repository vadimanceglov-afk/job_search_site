{% extends 'base.html' %}
{% load static %}
{% block content %}
<h2>Редагування мого профілю</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Зберегти зміни</button>
</form>

<hr>
    {% if user.employer %} 
        <a href="{% url 'job_company' %}" class="btn-exit">Назад до профілю</a>
    {% else %}
        <a href="{% url 'job_profile' %}" class="btn-exit">Назад до профілю</a>
    {% endif %}
{% endblock %}
